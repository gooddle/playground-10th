name: Build Test

on:
  push:
    branches: [ dev, feat/* ]
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '25'

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Build project with Gradle
        run: ./gradlew build -x test
