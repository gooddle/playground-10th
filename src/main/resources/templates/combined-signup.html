<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { display: flex; flex-direction: column; gap: 12px; width: 300px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 8px; cursor: pointer; }
        .tab-group { display: flex; gap: 0; }
        .tab { flex: 1; padding: 8px; cursor: pointer; border: 1px solid #ccc; background: #f5f5f5; text-align: center; }
        .tab.active { background: #fff; border-bottom-color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>회원가입</h2>

        <div class="tab-group">
            <div class="tab active" id="tab-sha" onclick="switchTab('SHA')">SHA</div>
            <div class="tab" id="tab-unhash" onclick="switchTab('UNHASH')">Unhash</div>
        </div>

        <p id="errorMsg" style="color: red; display: none;"></p>

        <form id="signupForm">
            <div>
                <label>이메일</label>
                <input type="text" id="email" name="email" />
            </div>
            <div>
                <label>비밀번호</label>
                <input type="password" id="password" name="password" />
            </div>
            <button type="submit">회원가입</button>
        </form>

        <a href="/combined-login">로그인으로 돌아가기</a>
    </div>

    <script>
        let currentType = 'SHA';

        function switchTab(type) {
            currentType = type;
            document.getElementById('tab-sha').classList.toggle('active', type === 'SHA');
            document.getElementById('tab-unhash').classList.toggle('active', type === 'UNHASH');
            document.getElementById('errorMsg').style.display = 'none';
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const apiUrl = currentType === 'SHA'
                ? '/api/v1/sha-users/signup'
                : '/api/v1/unhash-users/signup';

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });

            if (response.ok) {
                window.location.href = '/combined-login';
            } else {
                const data = await response.json();
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.textContent = data.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
