<!DOCTYPE html>
<html  lang="">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 300px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
    <h2>로그인</h2>

    <p id="errorMsg" style="color: red; display: none;"></p>

    <form id="loginForm">
        <div>
            <label>이메일</label>
            <label for="email"></label><input type="text" id="email" name="email" />
        </div>
        <div>
            <label>비밀번호</label>
            <label for="password"></label><input type="password" id="password" name="password" />
        </div>
        <button type="submit">로그인</button>
    </form>
    <a href="/signup">회원가입</a>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const response = await fetch('/api/v1/users/signIn', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('accessToken', data.accessToken);
                localStorage.setItem('refreshToken', data.refreshToken);
                localStorage.setItem('userType', 'NORMAL');
                window.location.href = '/feeds';
            } else {
                const data = await response.json();
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.textContent = data.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
    </div>
</body>
</html>
