<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
    <style>
        body { max-width: 600px; margin: 40px auto; padding: 0 16px; font-family: sans-serif; }
        h2 { display: flex; justify-content: space-between; align-items: center; }
        .feed-item { border-bottom: 1px solid #ddd; padding: 12px 0; cursor: pointer; }
        .feed-item:hover { background: #f9f9f9; }
        .feed-title { font-size: 16px; font-weight: bold; }
        .feed-date { font-size: 12px; color: #888; margin-top: 4px; }
        button { padding: 8px 16px; cursor: pointer; }
        .pagination { display: flex; gap: 8px; margin-top: 16px; justify-content: center; }
    </style>
</head>
<body>
    <h2>게시글 목록 <div><button onclick="location.href='/feeds/new'">글쓰기</button> <button id="logoutBtn">로그아웃</button></div></h2>
    <div id="feedList"></div>
    <div class="pagination">
        <button id="prevBtn" onclick="changePage(-1)">이전</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" onclick="changePage(1)">다음</button>
    </div>

    <script>
        let currentPage = 0;
        const size = 10;

        function getRefreshUrl() {
            const t = localStorage.getItem('userType');
            if (t === 'SHA') return '/api/v1/sha-users/refresh';
            if (t === 'UNHASH') return '/api/v1/unhash-users/refresh';
            return '/api/v1/users/refresh';
        }

        async function fetchWithRefresh(url, options = {}) {
            const token = localStorage.getItem('accessToken');
            options = { ...options, headers: { 'Authorization': `Bearer ${token}`, ...(options.headers || {}) } };

            let response = await fetch(url, options);
            if (response.status === 401) {
                const refreshToken = localStorage.getItem('refreshToken');
                if (!refreshToken) { window.location.href = '/login'; return; }

                const refreshResponse = await fetch(getRefreshUrl(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken })
                });

                if (!refreshResponse.ok) {
                    localStorage.clear();
                    window.location.href = '/login';
                    return;
                }

                const refreshData = await refreshResponse.json();
                localStorage.setItem('accessToken', refreshData.accessToken);
                localStorage.setItem('refreshToken', refreshData.refreshToken);

                options = { ...options, headers: { 'Authorization': `Bearer ${refreshData.accessToken}`, ...(options.headers || {}) } };
                response = await fetch(url, options);
            }
            return response;
        }

        async function loadFeeds() {
            const response = await fetchWithRefresh(`/api/v1/feeds?page=${currentPage}&size=${size}`);
            if (!response.ok) return;

            const data = await response.json();
            const list = document.getElementById('feedList');
            list.innerHTML = '';

            data.content.forEach(feed => {
                const div = document.createElement('div');
                div.className = 'feed-item';
                div.innerHTML = `<div class="feed-title">${feed.title}</div><div class="feed-date">${feed.createdAt}</div>`;
                div.onclick = () => location.href = `/feeds/${feed.id}`;
                list.appendChild(div);
            });

            document.getElementById('pageInfo').textContent = `${currentPage + 1} / ${data.totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage >= data.totalPages - 1;
        }

        function changePage(delta) {
            currentPage += delta;
            loadFeeds();
        }

        loadFeeds();

        function getLogoutUrl() {
            const result = localStorage.getItem('userType');
            if (result === 'SHA') return '/api/v1/sha-users/logout';
            if (result === 'UNHASH') return '/api/v1/unhash-users/logout';
            return '/api/v1/users/logout';
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            const response = await fetchWithRefresh(getLogoutUrl(), { method: 'POST' });
            if (response && response.ok) {
                localStorage.clear();
                window.location.href = '/login';
            }
        });
    </script>
</body>
</html>
