<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { display: flex; flex-direction: column; gap: 12px; width: 300px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 8px; cursor: pointer; }
        .tab-group { display: flex; }
        .tab { flex: 1; padding: 8px; cursor: pointer; border: 1px solid #ccc; background: #f5f5f5; text-align: center; }
        .tab.active { background: #fff; font-weight: bold; }
        .method-group { display: flex; gap: 16px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>로그인</h2>

        <div class="tab-group">
            <div class="tab active" id="tab-sha" onclick="switchUserType('SHA')">SHA</div>
            <div class="tab" id="tab-unhash" onclick="switchUserType('UNHASH')">Unhash</div>
        </div>

        <div class="method-group" id="method-group">
            <label><input type="radio" name="method" value="db" checked> DB 식별</label>
            <label id="method-db-hash"><input type="radio" name="method" value="db-hash"> DB 해싱+식별</label>
            <label><input type="radio" name="method" value="java"> Java 식별</label>
        </div>

        <p id="errorMsg" style="color: red; display: none;"></p>

        <form id="loginForm">
            <div>
                <label>이메일</label>
                <input type="text" id="email" name="email" />
            </div>
            <div>
                <label>비밀번호</label>
                <input type="password" id="password" name="password" />
            </div>
            <button type="submit">로그인</button>
        </form>

        <a href="/combined-signup">회원가입</a>
    </div>

    <script>
        let currentUserType = 'SHA';

        function switchUserType(type) {
            currentUserType = type;
            document.getElementById('tab-sha').classList.toggle('active', type === 'SHA');
            document.getElementById('tab-unhash').classList.toggle('active', type === 'UNHASH');
            document.getElementById('errorMsg').style.display = 'none';
            // db-hash 옵션은 SHA 탭일 때만 표시
            document.getElementById('method-db-hash').style.display = type === 'SHA' ? '' : 'none';
            // UNHASH 탭으로 전환 시 db-hash 선택돼 있으면 db로 초기화
            if (type === 'UNHASH' && document.querySelector('input[name="method"]:checked').value === 'db-hash') {
                document.querySelector('input[name="method"][value="db"]').checked = true;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const method = document.querySelector('input[name="method"]:checked').value;
            const base = currentUserType === 'SHA'
                ? '/api/v1/sha-users'
                : '/api/v1/unhash-users';
            const apiUrl = `${base}/signIn/${method}`;

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });

            if (response.ok) {
                window.location.href = '/feeds';
            } else {
                const data = await response.json();
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.textContent = data.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
