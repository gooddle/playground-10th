<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
    <style>
        body { max-width: 600px; margin: 40px auto; padding: 0 16px; font-family: sans-serif; }
        .box { display: flex; flex-direction: column; gap: 12px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 200px; resize: vertical; }
        .buttons { display: flex; gap: 8px; }
        button { padding: 8px 16px; cursor: pointer; }
        #errorMsg { color: red; display: none; }
    </style>
</head>
<body>
    <h2>게시글 작성</h2>
    <div class="box">
        <p id="errorMsg"></p>
        <label for="title"></label><input type="text" id="title" placeholder="제목" />
        <label for="body"></label><textarea id="body" placeholder="내용"></textarea>
        <div class="buttons">
            <button onclick="submit()">등록</button>
            <button onclick="location.href='/feeds'">취소</button>
        </div>
    </div>

    <script>
        async function fetchWithRefresh(url, options = {}) {
            let response = await fetch(url, options);
            if (response.status === 401) {
                const refreshResponse = await fetch('/api/v1/users/refresh', { method: 'POST' });
                if (!refreshResponse.ok) { window.location.href = '/login'; return; }
                response = await fetch(url, options);
            }
            return response;
        }

        async function submit() {
            const title = document.getElementById('title').value.trim();
            const body = document.getElementById('body').value.trim();

            if (!title || !body) {
                const msg = document.getElementById('errorMsg');
                msg.textContent = '제목과 내용을 입력해주세요.';
                msg.style.display = 'block';
                return;
            }

            const response = await fetchWithRefresh('/api/v1/feeds', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, body })
            });

            if (response.ok) {
                const data = await response.json();
                location.href = `/feeds/${data.id}`;
            }
        }
    </script>
</body>
</html>
