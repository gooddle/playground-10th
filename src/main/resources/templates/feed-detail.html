<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
    <style>
        body { max-width: 600px; margin: 40px auto; padding: 0 16px; font-family: sans-serif; }
        .meta { color: #888; font-size: 12px; margin-bottom: 16px; }
        .content { line-height: 1.6; white-space: pre-wrap; }
        .buttons { display: flex; gap: 8px; margin-top: 24px; }
        button { padding: 8px 16px; cursor: pointer; }

        .comment-section { margin-top: 40px; border-top: 2px solid #ddd; padding-top: 20px; }
        .comment-section h3 { margin-bottom: 16px; }
        .comment-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 14px; }
        .comment-item .comment-body { margin-bottom: 4px; }
        .comment-item .comment-meta { color: #aaa; font-size: 11px; }
        .comment-form { display: flex; gap: 8px; margin-top: 16px; }
        .comment-form textarea { flex: 1; padding: 8px; resize: vertical; height: 60px; font-family: sans-serif; font-size: 14px; }
        .comment-form button { align-self: flex-end; white-space: nowrap; }
        #commentList .empty { color: #aaa; font-size: 14px; padding: 10px 0; }
    </style>
</head>
<body>
    <h2 id="title"></h2>
    <div class="meta" id="meta"></div>
    <div class="content" id="body"></div>
    <div class="buttons">
        <button onclick="location.href='/feeds'">목록으로</button>
    </div>

    <div class="comment-section">
        <h3>댓글 <span id="commentCount"></span></h3>
        <div id="commentList"></div>
        <div class="comment-form">
            <textarea id="commentBody" placeholder="댓글을 입력하세요"></textarea>
            <button onclick="submitComment()">등록</button>
        </div>
    </div>

    <script>
        const feedId = location.pathname.split('/').pop();

        function getRefreshUrl() {
            const t = localStorage.getItem('userType');
            if (t === 'SHA') return '/api/v1/sha-users/refresh';
            if (t === 'UNHASH') return '/api/v1/unhash-users/refresh';
            return '/api/v1/users/refresh';
        }

        async function fetchWithRefresh(url, options = {}) {
            const token = localStorage.getItem('accessToken');
            options = { ...options, headers: { 'Authorization': `Bearer ${token}`, ...(options.headers || {}) } };

            let response = await fetch(url, options);
            if (response.status === 401) {
                const refreshToken = localStorage.getItem('refreshToken');
                if (!refreshToken) { window.location.href = '/login'; return; }

                const refreshResponse = await fetch(getRefreshUrl(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken })
                });

                if (!refreshResponse.ok) {
                    localStorage.clear();
                    window.location.href = '/login';
                    return;
                }

                const refreshData = await refreshResponse.json();
                localStorage.setItem('accessToken', refreshData.accessToken);
                localStorage.setItem('refreshToken', refreshData.refreshToken);

                options = { ...options, headers: { 'Authorization': `Bearer ${refreshData.accessToken}`, ...(options.headers || {}) } };
                response = await fetch(url, options);
            }
            return response;
        }

        async function loadFeed() {
            const response = await fetchWithRefresh(`/api/v1/feeds/${feedId}`);
            if (!response.ok) { location.href = '/feeds'; return; }

            const feed = await response.json();
            document.getElementById('title').textContent = feed.title;
            document.getElementById('meta').textContent = `작성일: ${feed.createdAt}`;
            document.getElementById('body').textContent = feed.body;
        }

        async function loadComments() {
            const response = await fetchWithRefresh(`/api/v1/comments?feedId=${feedId}`);
            if (!response || !response.ok) return;

            const comments = await response.json();
            const list = document.getElementById('commentList');
            list.innerHTML = '';

            document.getElementById('commentCount').textContent = `(${comments.length})`;

            if (comments.length === 0) {
                list.innerHTML = '<div class="empty">아직 댓글이 없습니다.</div>';
                return;
            }

            comments.forEach(c => {
                const div = document.createElement('div');
                div.className = 'comment-item';
                div.innerHTML = `
                    <div class="comment-body">${escapeHtml(c.body)}</div>
                    <div class="comment-meta">${c.createdAt ?? ''}</div>
                `;
                list.appendChild(div);
            });
        }

        async function submitComment() {
            const body = document.getElementById('commentBody').value.trim();
            if (!body) return;

            const response = await fetchWithRefresh('/api/v1/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ feedId: Number(feedId), body })
            });

            if (!response || !response.ok) { alert('댓글 등록에 실패했습니다.'); return; }

            document.getElementById('commentBody').value = '';
            loadComments();
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        loadFeed();
        loadComments();
    </script>
</body>
</html>
